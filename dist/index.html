<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Library</title>
  <script type="module" crossorigin src="/assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
            </div>
            <div class="logo-text">
                <span class="logo-title">The Library</span>
                <span class="logo-sub">Discover your next favorite book</span>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>Discover Your Next Great Read</h1>
        <p>Search millions of books, build your personal library, and never lose track of what to read next.</p>
        <div class="search-bar">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="search-input" placeholder="Search for books by title or author..." />
            <button id="search-btn">Search</button>
        </div>
    </section>

    <div class="content-wrapper">
        <div id="search-results" class="book-grid">
            <div id="status-msg" class="status-msg"></div>
        </div>

        <aside class="favorites-sidebar">
            <div class="favorites-header">
                <div class="fav-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                </div>
                <div>
                    <h2>Favorites</h2>
                    <p id="fav-count">0 books saved</p>
                </div>
            </div>
            <div id="favorites-list"></div>
        </aside>
    </div>

    <footer>
        <p>Powered by <a href="https://openlibrary.org" target="_blank" rel="noopener noreferrer">Open Library</a></p>
    </footer>

</body>
</html>
